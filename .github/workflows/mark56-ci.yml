name: Mark 56 CI

on:
  push:
    branches: ["main", "mark56-build-automation"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mark56-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile application modules
        run: python -m compileall -q main.py ui.py core actions plugins dashboard memory tests
      - name: Verify safe example config exists and parses
        run: python -c "import json,pathlib; p=pathlib.Path('config/api_keys.example.json'); assert p.is_file(), 'Missing example config'; json.loads(p.read_text(encoding='utf-8')); print('Example config valid')"
