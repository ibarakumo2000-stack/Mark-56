name: Build and publish Linux and macOS installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (example: 56.0.2)"
        required: true
        default: "56.0.2"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: jarvis-portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-26
          - target: macos-x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid semantic version: $VERSION"; exit 1; }
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install Linux build prerequisites
        if: matrix.target == 'linux-x86_64'
        run: |
          # GitHub-hosted runners can experience brief DNS/mirror outages.
          # Retry the complete apt operation with backoff instead of failing
          # the Linux package build on a transient Ubuntu mirror resolution error.
          for attempt in 1 2 3 4 5; do
            echo "Installing Linux prerequisites (attempt ${attempt}/5)..."
            if sudo apt-get -o Acquire::Retries=5 update && \
               sudo apt-get -o Acquire::Retries=5 install -y \
                 xvfb libxcb-cursor0 libegl1 libgl1 libasound2t64 libpulse0 libportaudio2; then
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              delay=$((attempt * 15))
              echo "apt failed; retrying in ${delay}s..."
              sleep "${delay}"
            fi
          done
          echo "Unable to install Linux prerequisites after 5 attempts."
          exit 1
      - name: Build self-contained installer
        run: python scripts/build_portable.py --target "${{ matrix.target }}" --version "$APP_VERSION"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.target }}-${{ env.APP_VERSION }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish package to the matching GitHub draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: JARVIS v${{ env.APP_VERSION }}
          draft: true
          prerelease: false
          make_latest: false
          files: |
            dist/*
