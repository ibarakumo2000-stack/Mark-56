name: Build Android Companion Testing Artifacts

on:
  push:
    branches: [main]
    paths:
      - "android-companion/**"
      - ".github/workflows/publish-android-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-companion-testing-build
  cancel-in-progress: false

jobs:
  build-testing-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run phone and watch tests and build debug APKs
        working-directory: android-companion
        run: |
          gradle --no-daemon \
            :app:testDebugUnitTest :wear-app:testDebugUnitTest \
            :app:assembleDebug :wear-app:assembleDebug
      - name: Upload debug artifacts for CI testing only
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-companion-debug-testing-only
          path: |
            android-companion/app/build/outputs/apk/debug/app-debug.apk
            android-companion/wear-app/build/outputs/apk/debug/wear-app-debug.apk
          if-no-files-found: error
          retention-days: 14
