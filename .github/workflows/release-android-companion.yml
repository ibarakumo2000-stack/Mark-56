name: Signed Android Companion Release

on:
  push:
    tags:
      - "companion-v*"

permissions:
  contents: write

concurrency:
  group: signed-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate release tag and signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^companion-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for name in KEYSTORE_B64 KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for Android release signing: ${name}"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mark56-release.keystore"
          test -s "$RUNNER_TEMP/mark56-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/mark56-release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          EXPECTED_CERT="$(keytool -exportcert -keystore "$RUNNER_TEMP/mark56-release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          test -n "$EXPECTED_CERT"
          printf '%s' "$EXPECTED_CERT" > "$RUNNER_TEMP/expected-android-cert-sha256"
      - name: Run phone and Wear OS unit tests
        working-directory: android-companion
        run: gradle --no-daemon :app:testDebugUnitTest :wear-app:testDebugUnitTest
      - name: Build signed APKs and Play-ready app bundles
        working-directory: android-companion
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/mark56-release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          gradle --no-daemon \
            :app:assembleRelease :wear-app:assembleRelease \
            :app:bundleRelease :wear-app:bundleRelease
      - name: Verify package identities, APK signatures and AAB signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          EXPECTED_CERT="$(cat "$RUNNER_TEMP/expected-android-cert-sha256")"
          EXPECTED_VERSION="${GITHUB_REF_NAME#companion-v}"
          PHONE_APK="android-companion/app/build/outputs/apk/release/app-release.apk"
          WATCH_APK="android-companion/wear-app/build/outputs/apk/release/wear-app-release.apk"
          PHONE_AAB="android-companion/app/build/outputs/bundle/release/app-release.aab"
          WATCH_AAB="android-companion/wear-app/build/outputs/bundle/release/wear-app-release.aab"

          test "$("$APKANALYZER" manifest application-id "$PHONE_APK")" = "com.mark56.companion"
          test "$("$APKANALYZER" manifest application-id "$WATCH_APK")" = "com.mark56.wear"
          test "$("$APKANALYZER" manifest version-name "$PHONE_APK")" = "$EXPECTED_VERSION"
          test "$("$APKANALYZER" manifest version-name "$WATCH_APK")" = "$EXPECTED_VERSION"

          "$APKSIGNER" verify --verbose --print-certs "$PHONE_APK" > "$RUNNER_TEMP/phone-signature.txt"
          "$APKSIGNER" verify --verbose --print-certs "$WATCH_APK" > "$RUNNER_TEMP/watch-signature.txt"
          PHONE_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/phone-signature.txt" | awk '{print toupper($NF)}')"
          WATCH_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/watch-signature.txt" | awk '{print toupper($NF)}')"
          test -n "$PHONE_CERT"
          test "$PHONE_CERT" = "$EXPECTED_CERT"
          test "$WATCH_CERT" = "$EXPECTED_CERT"

          "$ZIPALIGN" -c -P 16 -v 4 "$PHONE_APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$WATCH_APK"

          jarsigner -verify "$PHONE_AAB" >/dev/null
          jarsigner -verify "$WATCH_AAB" >/dev/null
          PHONE_AAB_CERT="$(keytool -printcert -jarfile "$PHONE_AAB" | awk '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"
          WATCH_AAB_CERT="$(keytool -printcert -jarfile "$WATCH_AAB" | awk '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"
          test "$PHONE_AAB_CERT" = "$EXPECTED_CERT"
          test "$WATCH_AAB_CERT" = "$EXPECTED_CERT"
          echo "Both APKs and AABs are signed by the configured owner keystore; package IDs, versions and APK alignment are verified."
      - name: Stage stable release packages and checksums
        run: |
          set -euo pipefail
          mkdir -p release-apks
          cp android-companion/app/build/outputs/apk/release/app-release.apk "release-apks/JARVIS-Companion.apk"
          cp android-companion/wear-app/build/outputs/apk/release/wear-app-release.apk "release-apks/JARVIS-Watch.apk"
          cp android-companion/app/build/outputs/bundle/release/app-release.aab "release-apks/JARVIS-Companion.aab"
          cp android-companion/wear-app/build/outputs/bundle/release/wear-app-release.aab "release-apks/JARVIS-Watch.aab"
          cd release-apks
          sha256sum -- *.apk *.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-signed-android-release
          path: release-apks/*
          if-no-files-found: error
          retention-days: 90
      - uses: softprops/action-gh-release@v2
        with:
          name: JARVIS Android Companion ${{ github.ref_name }}
          body: |
            Production-signed Android phone and Wear OS packages.

            Direct APK installs are available below. Play-ready AAB files are also included for Play Console submission. Verify each download with SHA256SUMS.txt.

            The app requires Android 8.0 or later. First-run pairing, notification relay, media controls, Wear OS forwarding and remote relay remain opt-in.
          files: release-apks/*
          fail_on_unmatched_files: true
          make_latest: false
