name: Signed Android Companion Release

on:
  push:
    tags:
      - "companion-v*"

permissions:
  contents: write

concurrency:
  group: signed-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for Android release signing: ${name}"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mark56-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/mark56-release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build signed phone and watch APKs
        working-directory: android-companion
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/mark56-release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleRelease :wear-app:assembleRelease
      - name: Stage release APKs and checksums
        run: |
          set -euo pipefail
          mkdir -p release-apks
          cp android-companion/app/build/outputs/apk/release/app-release.apk "release-apks/JARVIS-Companion-${GITHUB_REF_NAME}.apk"
          cp android-companion/wear-app/build/outputs/apk/release/wear-app-release.apk "release-apks/JARVIS-Watch-${GITHUB_REF_NAME}.apk"
          cd release-apks
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-signed-android-apks
          path: release-apks/*
          if-no-files-found: error
          retention-days: 90
      - uses: softprops/action-gh-release@v2
        with:
          name: JARVIS Android Companion ${{ github.ref_name }}
          body: |
            Signed Android phone companion and Wear OS companion APKs.

            Verify downloads with SHA256SUMS.txt. Install the phone companion on Android and the watch companion on a supported Wear OS device. First-run pairing and device permissions remain opt-in.
          files: release-apks/*
          fail_on_unmatched_files: true
          make_latest: false
