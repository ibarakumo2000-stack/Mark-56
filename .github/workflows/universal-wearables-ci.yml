name: Universal Wearables & Companion CI

on:
  pull_request:
    branches: [main]
    paths:
      - "core/device_*.py"
      - "core/device_protocols.py"
      - "core/glasses_adapters.py"
      - "relay/**"
      - "tests/test_glasses_adapters.py"
      - "tests/test_relay_registry.py"
      - "tests/test_desktop_relay_bridge.py"
      - "core/transports/**"
      - "tests/test_bleak_transport.py"
      - "android-companion/**"
      - ".github/workflows/universal-wearables-ci.yml"
  push:
    branches: [main]
    paths:
      - "core/device_*.py"
      - "core/device_protocols.py"
      - "core/transports/**"
      - "tests/test_bleak_transport.py"
      - "android-companion/**"
      - ".github/workflows/universal-wearables-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Test optional BLE transport
        run: python -m unittest discover -s tests -p 'test_*device*.py' -v
          python -m unittest discover -s tests -p 'test_*glasses*.py' -v
          python -m unittest discover -s tests -p 'test_*relay*.py' -v
      - name: Compile device modules
        run: python -m compileall -q core/transports core/device_protocols.py core/device_simulator.py core/glasses_adapters.py relay

  android-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        working-directory: android-companion
        run: gradle --no-daemon :app:assembleDebug :wear-app:assembleDebug :app:testDebugUnitTest
      - name: Run Android unit tests
        working-directory: android-companion
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mark56-companion-debug-apk
          path: |
            android-companion/app/build/outputs/apk/debug/app-debug.apk
            android-companion/wear-app/build/outputs/apk/debug/wear-app-debug.apk
          if-no-files-found: error
