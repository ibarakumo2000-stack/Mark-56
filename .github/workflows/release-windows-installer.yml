name: Build and publish JARVIS desktop installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (example: 56.0.0)"
        required: true
        default: "56.0.0"
        type: string
  push:
    branches:
      - "mark56-build-automation"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: jarvis-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-version:
    name: Determine package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate semantic version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
          else
            version="56.0.0"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH, for example 56.0.0." >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Preparing JARVIS desktop installers for $version"

  build-windows:
    name: Build Windows installer
    needs: determine-version
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Join-Path \${env:ProgramFiles(x86)} "Inno Setup 6"
          if (-not (Test-Path (Join-Path $iscc "ISCC.exe"))) {
            throw "Inno Setup 6 was not installed correctly."
          }
          $iscc >> $env:GITHUB_PATH
      - name: Build, scan, and smoke-test installer
        shell: pwsh
        run: |
          python scripts/build.py --version "${{ needs.determine-version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer build or smoke test failed."
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-${{ needs.determine-version.outputs.version }}
          path: dist/MARK-LV-Setup-${{ needs.determine-version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux installer
    needs: determine-version
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native libraries for Qt and audio smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2 libegl1 libgl1 libportaudio2 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Build and smoke-test Linux package
        run: python scripts/build_portable.py --target linux-x86_64 --version "${{ needs.determine-version.outputs.version }}"
      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-${{ needs.determine-version.outputs.version }}
          path: |
            dist/MARK-LV-Linux-x86_64.tar.gz
            dist/build-info-linux-x86_64.json
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS installer (${{ matrix.arch }})
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: macos-arm64
            runner: macos-15
            asset: dist/MARK-LV-macOS-arm64.dmg
          - arch: x86_64
            target: macos-x86_64
            runner: macos-15-intel
            asset: dist/MARK-LV-macOS-x86_64.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and smoke-test macOS package
        run: python scripts/build_portable.py --target "${{ matrix.target }}" --version "${{ needs.determine-version.outputs.version }}"
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.arch }}-${{ needs.determine-version.outputs.version }}
          path: |
            ${{ matrix.asset }}
            dist/build-info-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish verified installers
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - determine-version
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*-${{ needs.determine-version.outputs.version }}
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          test -f "MARK-LV-Setup-${{ needs.determine-version.outputs.version }}.exe"
          test -f "MARK-LV-Linux-x86_64.tar.gz"
          test -f "MARK-LV-macOS-arm64.dmg"
          test -f "MARK-LV-macOS-x86_64.dmg"
          sha256sum *.exe *.tar.gz *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish official GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.determine-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: JARVIS v${{ needs.determine-version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            JARVIS / Mark 56 desktop installers.

            Windows x64: MARK-LV-Setup-<version>.exe
            Linux x64: MARK-LV-Linux-x86_64.tar.gz (extract, then run bash install.sh)
            macOS Apple silicon: MARK-LV-macOS-arm64.dmg
            macOS Intel: MARK-LV-macOS-x86_64.dmg
            SHA-256 checksums: SHA256SUMS.txt

            All packages passed the staged-source secret scan and bundled-runtime import smoke test before upload.
            Windows is not code-signed unless signing is configured. macOS packages are unsigned and not notarized;
            macOS may show a security warning. Linux packages may require native Qt/audio libraries from the distro.
            Online AI features require internet access and the user's own provider API key.
          files: |
            dist/MARK-LV-Setup-${{ needs.determine-version.outputs.version }}.exe
            dist/MARK-LV-Linux-x86_64.tar.gz
            dist/MARK-LV-macOS-arm64.dmg
            dist/MARK-LV-macOS-x86_64.dmg
            dist/SHA256SUMS.txt
